<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Decider</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>🍽️ Meal Decider</h1>
    <p class="tagline">What can I cook with what I have?</p>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="pantry">My Pantry</button>
    <button class="tab" data-tab="plan">Plan a Meal</button>
    <button class="tab" data-tab="results">Results</button>
    <button class="tab" data-tab="shopping">Shopping List</button>
  </nav>

  <main class="content">
    <!-- Pantry Tab -->
    <section id="pantry" class="tab-content active">
      <div class="pantry-header">
        <h2>My Pantry</h2>
        <div class="pantry-stats" id="pantryStats"></div>
      </div>
      <div class="add-item-form">
        <h3>Add Ingredient</h3>
        <div class="form-row">
          <input type="text" id="itemName" placeholder="Ingredient name (e.g. eggs)" list="ingredientSuggestions">
          <datalist id="ingredientSuggestions"></datalist>
          <input type="number" id="itemQty" placeholder="Qty" min="0" step="0.5" value="1">
          <select id="itemUnit">
            <option value="whole">whole</option>
            <option value="cup">cup</option>
            <option value="tbsp">tbsp</option>
            <option value="tsp">tsp</option>
            <option value="oz">oz</option>
            <option value="slice">slice</option>
            <option value="clove">clove</option>
            <option value="can">can</option>
            <option value="pack">pack</option>
            <option value="leaf">leaf</option>
            <option value="stalk">stalk</option>
            <option value="pinch">pinch</option>
          </select>
          <input type="date" id="itemExpiry" title="Expiry date (optional)">
          <button class="btn-primary" id="addItemBtn">Add</button>
        </div>
      </div>
      <div class="pantry-list" id="pantryList"></div>
      <div class="pantry-actions">
        <button class="btn-secondary" id="loadSamplePantry">Load Sample Pantry</button>
        <button class="btn-danger" id="clearPantry">Clear All</button>
      </div>
    </section>

    <!-- Plan Tab -->
    <section id="plan" class="tab-content">
      <h2>Plan a Meal</h2>
      <p class="section-desc">Tell me your constraints and I'll find meals you can actually make.</p>
      <div class="plan-form">
        <div class="form-group">
          <label>Servings</label>
          <input type="number" id="servings" value="1" min="1" max="10">
        </div>
        <div class="form-group">
          <label>Time available (minutes)</label>
          <input type="number" id="timeAvail" value="30" min="5" max="180" step="5">
        </div>
        <div class="form-group">
          <label>Budget for missing ingredients ($)</label>
          <input type="number" id="budget" value="10" min="0" step="0.50">
        </div>

        <div class="form-group">
          <label>Equipment available</label>
          <div class="checkbox-group" id="equipmentGroup">
            <label><input type="checkbox" value="stove" checked> Stove</label>
            <label><input type="checkbox" value="microwave" checked> Microwave</label>
            <label><input type="checkbox" value="oven"> Oven</label>
            <label><input type="checkbox" value="no-cook"> No cook only</label>
          </div>
        </div>

        <div class="form-group">
          <label>Diet rules</label>
          <div class="checkbox-group" id="dietGroup">
            <label><input type="checkbox" value="vegetarian"> Vegetarian</label>
            <label><input type="checkbox" value="vegan"> Vegan</label>
            <label><input type="checkbox" value="gluten-free"> Gluten-free</label>
            <label><input type="checkbox" value="dairy-free"> Dairy-free</label>
          </div>
        </div>

        <div class="form-group">
          <label>Allergies (comma-separated)</label>
          <input type="text" id="allergies" placeholder="e.g. peanuts, shellfish">
        </div>

        <div class="form-group">
          <label>Liked cuisines</label>
          <div class="checkbox-group" id="cuisineGroup">
            <label><input type="checkbox" value="Italian" checked> Italian</label>
            <label><input type="checkbox" value="Asian" checked> Asian</label>
            <label><input type="checkbox" value="Mexican"> Mexican</label>
            <label><input type="checkbox" value="American" checked> American</label>
            <label><input type="checkbox" value="Mediterranean"> Mediterranean</label>
            <label><input type="checkbox" value="Indian"> Indian</label>
          </div>
        </div>

        <div class="form-group">
          <label>Disliked ingredients (comma-separated)</label>
          <input type="text" id="dislikes" placeholder="e.g. cilantro, mushrooms">
        </div>

        <button class="btn-primary btn-large" id="findMealsBtn">Find Meals</button>
      </div>
    </section>

    <!-- Results Tab -->
    <section id="results" class="tab-content">
      <h2>Meal Recommendations</h2>
      <div id="resultsContent"></div>
    </section>

    <!-- Shopping List Tab -->
    <section id="shopping" class="tab-content">
      <h2>Shopping List</h2>
      <div id="shoppingContent"></div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
